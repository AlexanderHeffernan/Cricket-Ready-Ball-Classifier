name: Build and Deploy Frontend to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency: ci-${{github.ref}}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
          token: ${{ github.token }}
          force: false

      # GITHUB_TOKEN pushes do not automatically trigger legacy branch-based Pages builds.
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
