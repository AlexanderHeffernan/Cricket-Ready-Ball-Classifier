[package]
name = "Cricket-Ready-Backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { version = "4.17", default-features = false, features = ["macros", "openssl"] }
actix-cors = "0.7"
actix-governor = "0.10"
actix-multipart = "0.7"
futures-util = "0.3"
tempfile = "3"
openssl = "0.10"
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.11"
