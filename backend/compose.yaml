services:
  api:
    build: .
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 64
    cpus: 2
    ports: ["127.0.0.1:49161:49161"]
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    volumes:
      - contributions:/data
      - ./certs/cricket-ready.crt:/app/cricket-ready.crt:ro
      - ./certs/cricket-ready.key:/app/cricket-ready.key:ro
    environment:
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://alexheffernan.dev,https://alexanderheffernan.github.io}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  contributions:
