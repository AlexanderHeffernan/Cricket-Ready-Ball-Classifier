<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found | Cricket-Ready Ball Classifier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #F8F9FA;
            color: #2E7D32;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 2px 12px rgba(46, 125, 50, 0.08);
        }
        h1 {
            font-size: 5rem;
            margin: 0 0 10px 0;
            color: #C62828;
        }
        h2 {
            margin: 0 0 20px 0;
            font-size: 2rem;
            color: #2E7D32;
        }
        p {
            color: #555;
            margin-bottom: 30px;
        }
        a {
            display: inline-block;
            padding: 10px 24px;
            background: #2E7D32;
            color: #fff;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        a:hover {
            background: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Sorry, the page you are looking for does not exist.<br>
            You can return to the main app below.</p>
        <a href="/">Go to Home</a>
    </div>
</body>
</html>
